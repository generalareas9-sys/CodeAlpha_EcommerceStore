<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account — ShopNova</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js" defer></script>
    <script src="/js/auth.js" defer></script>
  </head>
  <body data-page="register">
    <div id="site-header"></div>
    <main class="auth-layout wrap">
      <aside class="auth-promo-panel">
        <a class="brand" href="/"><span class="brand-mark">S</span>Shop<span class="brand-accent">Nova</span></a>
        <h2>Good finds, just for you.</h2>
        <p>Create your free account to save your cart and keep track of every order.</p>
        <span class="auth-promo-tag">YOUR SHOPPING, UPGRADED.</span>
      </aside>
      <section class="auth-card">
        <p class="eyebrow">Make yourself at home</p><h1>Create your account</h1>
        <p class="muted">Join ShopNova and make checkout quicker next time.</p>
        <form id="register-form" class="form-stack">
          <label>Your name<input type="text" name="name" autocomplete="name" required minlength="2" maxlength="80" placeholder="Your name"></label>
          <label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
          <label>Password<span class="password-field"><input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="At least 8 characters"></span><small>Use at least 8 characters.</small></label>
          <p class="form-message" id="form-message" role="alert"></p>
          <button class="button button-dark" type="submit">Create account</button>
        </form>
        <p class="form-switch">Already have an account? <a href="/login.html">Log in</a></p>
      </section>
    </main>
    <div id="site-footer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
