<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout — ShopNova</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js" defer></script>
    <script src="/js/cart.js" defer></script>
  </head>
  <body data-page="checkout">
    <div id="site-header"></div>
    <main class="wrap page-main">
      <nav class="checkout-steps" aria-label="Checkout progress"><span class="step-done">01 <b>Cart</b></span><i></i><span class="step-active" aria-current="step">02 <b>Details</b></span><i></i><span>03 <b>Confirm</b></span></nav>
      <p class="eyebrow">Almost yours</p><h1>Checkout</h1>
      <div id="checkout-content" aria-live="polite"><div class="cart-skeleton skeleton"></div></div>
    </main>
    <div id="site-footer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
